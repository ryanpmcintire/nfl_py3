name: Data contract monitor

# Manual only since 2026-09-04: no hosted Actions minutes are to be spent on
# this project; `nfl-ats smoke-source` runs locally instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nflverse-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked runtime
        run: uv sync --locked --no-dev

      - name: Validate current schedules and latest completed stats
        run: uv run nfl-ats smoke-source
