server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    auth_basic "ATS Terminal";
    auth_basic_user_file /run/secrets/dashboard_htpasswd;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'none'; font-src 'self' https://fonts.gstatic.com; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        limit_except GET HEAD {
            deny all;
        }
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ ^/(?:index|model|history|findings)\.html$ {
        try_files $uri =404;
        limit_except GET HEAD {
            deny all;
        }
    }

    location / {
        return 404;
    }
}
