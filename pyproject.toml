[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nfl-ats"
version = "0.2.0"
description = "Leak-safe NFL against-the-spread research and prediction pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Ryan McIntire" }]
dependencies = [
  "joblib>=1.4",
  "nflreadpy>=0.1.5",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pypdf>=6.16.2",
  "scikit-learn>=1.6",
  "tabulate>=0.9",
]

[project.scripts]
nfl-ats = "nfl_ats.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_ats"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nfl_ats"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100
# .promotion-* dirs are OS-corrupted litter from a crashed 2026-08-21 session
# (unreadable ACLs; see HANDOFF). Ruff panics trying to scan them locally.
extend-exclude = [".promotion-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["nflreadpy.*", "sklearn.*", "joblib.*", "scipy.*"]
ignore_missing_imports = true

# nfl_ats.fluview_production_feature reuses scripts/fluview_battery_screen.py's
# frozen as-of construction unchanged (docs/fluview_on_production.md: "reuse
# the existing as-of/leakage-safe construction exactly -- do not rebuild it"),
# the same "scripts is not part of the installed package" sys.path pattern
# nfl_ats.cli._ensure_repo_root_on_path already uses. `mypy src` was never
# configured to gate scripts/*.py (that tree is standalone research scripts,
# not the installed package), so pulling one into src's import graph now
# surfaces pre-existing typing gaps in a frozen, already-verified battery
# script this session must not edit. Scoped to exactly the two script modules
# reached this way, not a blanket scripts.* exemption.
[[tool.mypy.overrides]]
module = ["scripts.fluview_battery_screen", "scripts.fluview_battery_ingest"]
ignore_errors = true

# Same situation, same precedent, one module later (WP17): src/nfl_ats/
# inactives_capture.py imports scripts/ingest_nflcom_injuries.py's team-code
# map, HTML-stripping helper, and current-week resolver VERBATIM rather than
# duplicating them (that script is the working, already-production parser for
# NFL.com's other "report" page). `mypy src` was never configured to gate
# scripts/*.py; pulling this one into src's import graph surfaces three
# pre-existing typing gaps (lines 415/554/562) in a script this work package
# must not edit. Scoped to exactly this one script module, not a blanket
# scripts.* exemption.
[[tool.mypy.overrides]]
module = ["scripts.ingest_nflcom_injuries"]
ignore_errors = true

# Same situation, same precedent again (2026-09-01 on-production sweep):
# src/nfl_ats/illness_production_feature.py imports
# scripts/illness_battery_screen.py's frozen point-in-time-safe as-of
# construction VERBATIM rather than rebuilding it
# (docs/illness_on_production.md section 2: the pick-deadline cutoff and the
# per-(season, week, team, gsis_id) latest-visible-revision resolution are
# inherited, not re-derived). `mypy src` was never configured to gate
# scripts/*.py; pulling this one into src's import graph surfaces its
# unqualified `from _common import ...` sibling-script import, which resolves
# at runtime via the sys.path insert that script performs but has no stub for
# mypy. Scoped to exactly this one script module, not a blanket scripts.*
# exemption, and the frozen script itself is not edited.
[[tool.mypy.overrides]]
module = ["scripts.illness_battery_screen"]
ignore_errors = true

# Same situation, same precedent again (2026-09-01 on-production sweep, second
# construct): src/nfl_ats/reddit_attention_production_feature.py imports
# scripts/arctic_shift_battery_screen.py's frozen point-in-time-safe attention
# construction VERBATIM rather than rebuilding it
# (docs/reddit_attention_on_production.md section 2: the Tuesday-ending 7-day
# window, the shift(1) trailing baseline reset per (team, season), and the
# SPIKE_THRESHOLD are inherited, not re-derived). `mypy src` was never
# configured to gate scripts/*.py; pulling this one into src's import graph
# surfaces its unqualified `from _common import ...` / `from
# arctic_shift_battery_fetch import ...` sibling-script imports, which resolve
# at runtime via the sys.path insert that script performs but have no stub for
# mypy. Scoped to exactly this one script module, not a blanket scripts.*
# exemption, and the frozen script itself is not edited.
[[tool.mypy.overrides]]
module = ["scripts.arctic_shift_battery_screen"]
ignore_errors = true

# Same situation, same precedent again (2026-09-01 on-production sweep):
# src/nfl_ats/redzone_reversion_production_feature.py imports
# scripts/redzone_reversion_screen.py's frozen efficiency-panel construction
# VERBATIM rather than rebuilding it (docs/redzone_reversion_on_production.md
# section 2: build_efficiency_panels, _alias_team and _prior are inherited,
# not re-derived, so the on-production column is measured on the same panel
# the frozen battery scored). `mypy src` was never configured to gate
# scripts/*.py; pulling this one into src's import graph surfaces its
# unqualified `from _common import ...` sibling-script import, which resolves
# at runtime via the sys.path insert that script performs but has no stub for
# mypy. Scoped to exactly this one script module, not a blanket scripts.*
# exemption, and the frozen script itself is not edited.
[[tool.mypy.overrides]]
module = ["scripts.redzone_reversion_screen"]
ignore_errors = true
