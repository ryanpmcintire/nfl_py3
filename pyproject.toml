[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nfl-ats"
version = "0.2.0"
description = "Leak-safe NFL against-the-spread research and prediction pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Ryan McIntire" }]
dependencies = [
  "joblib>=1.4",
  "nflreadpy>=0.1.5",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pypdf>=6.16.2",
  "scikit-learn>=1.6",
  "tabulate>=0.9",
]

[project.scripts]
nfl-ats = "nfl_ats.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_ats"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nfl_ats"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["nflreadpy.*", "sklearn.*", "joblib.*", "scipy.*"]
ignore_missing_imports = true
