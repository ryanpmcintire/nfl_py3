[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nfl-ats"
version = "0.2.0"
description = "Leak-safe NFL against-the-spread research and prediction pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Ryan McIntire" }]
dependencies = [
  "joblib>=1.4",
  "nflreadpy>=0.1.5",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pypdf>=6.16.2",
  "scikit-learn>=1.6",
  "tabulate>=0.9",
]

[project.scripts]
nfl-ats = "nfl_ats.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_ats"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nfl_ats"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100
# .promotion-* dirs are OS-corrupted litter from a crashed 2026-08-21 session
# (unreadable ACLs; see HANDOFF). Ruff panics trying to scan them locally.
extend-exclude = [".promotion-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["nflreadpy.*", "sklearn.*", "joblib.*", "scipy.*"]
ignore_missing_imports = true

# nfl_ats.fluview_production_feature reuses scripts/fluview_battery_screen.py's
# frozen as-of construction unchanged (docs/fluview_on_production.md: "reuse
# the existing as-of/leakage-safe construction exactly -- do not rebuild it"),
# the same "scripts is not part of the installed package" sys.path pattern
# nfl_ats.cli._ensure_repo_root_on_path already uses. `mypy src` was never
# configured to gate scripts/*.py (that tree is standalone research scripts,
# not the installed package), so pulling one into src's import graph now
# surfaces pre-existing typing gaps in a frozen, already-verified battery
# script this session must not edit. Scoped to exactly the two script modules
# reached this way, not a blanket scripts.* exemption.
[[tool.mypy.overrides]]
module = ["scripts.fluview_battery_screen", "scripts.fluview_battery_ingest"]
ignore_errors = true
