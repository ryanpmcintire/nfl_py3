services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: nfl-ats-dashboard:local
    user: "101:101"
    ports:
      - "${NFL_ATS_BIND_ADDRESS:-127.0.0.1}:${NFL_ATS_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - dashboard_htpasswd
    restart: unless-stopped

secrets:
  dashboard_htpasswd:
    file: ${NFL_ATS_HTPASSWD_FILE:-.secrets/dashboard.htpasswd}
